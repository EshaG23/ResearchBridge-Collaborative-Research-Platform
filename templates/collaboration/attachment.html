<div class="chat-attachment">{% url 'collaboration:attachment' a.message.community_id a.pk as file_url %}{% if a.kind == 'image' %}<a href="{{ file_url }}" target="_blank" rel="noopener"><img src="{{ file_url }}" alt="{{ a.filename }}" loading="lazy"></a>{% elif a.kind == 'audio' %}<audio controls preload="none" src="{{ file_url }}"></audio>{% elif a.kind == 'video' %}<video controls preload="none" playsinline src="{{ file_url }}"></video>{% endif %}<a class="attachment-download" href="{{ file_url }}?download=1">↓ {{ a.filename }} <small>{{ a.size|filesizeformat }}</small></a></div>
